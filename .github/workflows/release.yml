name: Release

# Push a tag like v1.2.3 to build a signed APK and publish it as a GitHub release.
# Run it manually from the Actions tab to test the build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
            # v1.2.3 -> 10203. Each part must stay under 100.
            IFS=. read -r major minor patch <<< "${name%%-*}"
            code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::KEYSTORE_BASE64 secret is missing. Releases must be signed with the release key."
              exit 1
            fi
            echo "::warning::No signing key. This test build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEASURE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MEASURE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MEASURE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MEASURE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename APK
        id: apk
        run: |
          out="measure-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: measure-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}"
          --title "Measure $GITHUB_REF_NAME"
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
